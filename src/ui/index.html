<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClipHistory</title>

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="titlebar">
    <span class="brand"></span>
    <button id="captureToggle" class="capture-toggle" type="button" role="switch" aria-checked="true" title="Pause clipboard capture">
      <span class="capture-label">Capturing</span>
      <span class="switch"><span class="knob"></span></span>
    </button>
    <div class="wctl">
      <button title="Minimise" aria-label="Minimise"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button title="Maximise" aria-label="Maximise"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button class="close" title="Close" aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.3"/></svg></button>
    </div>
  </div>

  <div class="body">

    <aside class="side">
      <nav class="kinds" id="kinds" aria-label="Clip types"></nav>
      <div class="searchbar">
        <div class="search">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.3" style="color:var(--ink-faint)"><circle cx="7.2" cy="7.2" r="5"/><path d="M11 11l4 4"/></svg>
          <input id="q" type="search" placeholder="Search clipboard…" aria-label="Search clipboard">
        </div>
      </div>
      <div class="list" id="list" role="listbox" aria-label="Clips"></div>
    </aside>

    <article class="detail" id="detail" aria-live="polite"></article>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
